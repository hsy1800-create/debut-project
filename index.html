<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26305A">
<title>데뷔 프로젝트: 기획사를 살려라</title>
<meta name="description" content="6학년 사회 '우리나라 경제의 특징' 단원을 기획사 경영 이야기로 풀어 보는 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF4FF; --grid: #D5E3FA; --ink: #1C2B4A; --ink2: #4A5878; --line: #B9C8E4;
  --pink: #FF3D7F; --pink-soft: #FFE1EC; --blue: #2F6FEB; --blue-soft: #E3ECFF;
  --yellow: #FFD23F; --green: #1E9B63; --green-soft: #DDF5EA; --red: #E5484D; --red-soft: #FFE4E4;
  --white: #fff;
  --display: 'Jua', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: clamp(15px, calc(0.8vw + 0.6vh + 5px), 21px); }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: var(--body); color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
img { display: block; max-width: 100%; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.hidden { display: none !important; }

/* 버튼 (스티커처럼 두꺼운 테두리) */
.btn {
  font-family: var(--display); font-size: 1.15rem; line-height: 1.2; padding: .7em 1.4em; border-radius: 16px;
  border: 3px solid var(--ink); background: var(--white); box-shadow: 0 4px 0 var(--ink);
  transition: transform .06s, box-shadow .06s; min-height: 52px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--pink); color: var(--white); }
.btn.blue { background: var(--blue); color: var(--white); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; text-decoration: underline; text-underline-offset: 4px; min-height: 44px; }
.btn:disabled { opacity: .45; transform: none; box-shadow: 0 4px 0 var(--ink); cursor: default; }
.btn.small { font-size: .95rem; padding: .45em .9em; min-height: 44px; border-radius: 12px; }

/* ===== 제목 화면 ===== */
.title-screen { flex: 1; display: grid; grid-template-rows: 1fr auto; overflow: hidden; position: relative; }
.title-stage {
  position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  background:
    radial-gradient(ellipse 30% 70% at 20% 0%, rgba(255,210,63,.35), transparent 70%),
    radial-gradient(ellipse 30% 70% at 80% 0%, rgba(255,61,127,.30), transparent 70%),
    linear-gradient(#26305A, #3B2B6B 70%, #4B2E74);
}
.title-stage::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 16%;
  background: linear-gradient(#5A3A86, #3A2560); border-top: 4px solid var(--ink);
}
.logo { position: absolute; top: 4%; left: 0; right: 0; text-align: center; z-index: 2; color: var(--white); }
.logo .kicker { font-family: var(--display); font-size: 1.1rem; color: var(--yellow); letter-spacing: .02em; }
.logo h1 {
  font-family: var(--display); font-weight: 400; margin: .1em 0 0; font-size: clamp(2.6rem, 7.5vw, 5.2rem); line-height: 1;
  color: var(--white); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--pink);
}
.logo .sub { font-family: var(--display); font-size: clamp(1.2rem, 2.6vw, 1.9rem); margin-top: .35em; color: var(--white); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.title-lineup { position: relative; z-index: 1; width: min(92%, 760px); margin-bottom: 2%; filter: drop-shadow(0 8px 0 rgba(0,0,0,.25)); }
.title-menu { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 16px; background: var(--white); border-top: 4px solid var(--ink); }
.title-menu .meta { width: 100%; text-align: center; font-size: .9rem; color: var(--ink2); }

/* ===== 진행 화면 위쪽 막대 ===== */
.hud {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--white); border-bottom: 3px solid var(--ink);
  flex-wrap: nowrap; min-height: 60px; position: relative; z-index: 5;
}
.hud-ch { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.hud-ch b { font-family: var(--display); font-weight: 400; font-size: 1.05rem; color: var(--pink); white-space: nowrap; }
.hud-ch span { font-size: .85rem; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauges { display: flex; gap: 10px; flex: 0 1 auto; }
.gauge { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 4px; align-items: center; width: 92px; position: relative; }
.gauge .gi { grid-row: 1 / span 2; font-size: 1.25rem; line-height: 1; }
.gauge .gn { font-size: .72rem; color: var(--ink2); display: flex; justify-content: space-between; }
.gauge .gn b { color: var(--ink); font-weight: 700; }
.gauge .bar { height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: #F1F4FA; overflow: hidden; }
.gauge .bar i { display: block; height: 100%; background: var(--c); transition: width .6s ease; }
.gauge .delta { position: absolute; right: -6px; top: -14px; font-family: var(--display); font-size: .95rem; background: var(--white); border: 2px solid currentColor; border-radius: 999px; padding: 0 6px; line-height: 1.3; z-index: 2; animation: floatup 1.6s ease forwards; pointer-events: none; }
.gauge .delta.up { color: var(--green); } .gauge .delta.down { color: var(--red); }
@keyframes floatup { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
.hud-btns { display: flex; gap: 8px; flex: none; }
.icon-btn { border: 3px solid var(--ink); background: var(--white); border-radius: 12px; min-width: 48px; min-height: 48px; font-family: var(--display); font-size: 1rem; padding: 0 10px; box-shadow: 0 3px 0 var(--ink); }
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

/* ===== 무대(배경) ===== */
.stage { flex: 1; position: relative; overflow: hidden; }
.bg-paper { background: transparent; }
.bg-office { background:
  linear-gradient(transparent 76%, #C7A982 76%, #B8966C 100%),
  linear-gradient(transparent 62%, #CBD6E8 62%, #CBD6E8 63.2%, transparent 63.2%),
  linear-gradient(90deg, transparent 63%, var(--ink) 63%, var(--ink) 63.5%, #A9D3F7 63.5%, #D4ECFF 77%, var(--ink) 77%, var(--ink) 77.5%, #A9D3F7 77.5%, #D4ECFF 91%, var(--ink) 91%, var(--ink) 91.5%, transparent 91.5%) 0 14% / 100% 40% no-repeat,
  linear-gradient(90deg, transparent 40%, #FFD6E7 40%, #FFD6E7 52%, transparent 52%) 0 18% / 100% 26% no-repeat,
  linear-gradient(#E4ECF8, #D7E2F2); }
.bg-practice { background:
  linear-gradient(transparent 74%, #D9A86C 74%, #C48F52 100%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.0) 0 18%, rgba(255,255,255,.65) 18% 18.5%),
  linear-gradient(transparent 46%, #8C96AE 46%, #8C96AE 47.2%, transparent 47.2%),
  linear-gradient(#DDE7F4, #C9D6EA); }
.bg-night { background:
  radial-gradient(ellipse 40% 50% at 70% 10%, rgba(255,220,140,.35), transparent 70%),
  linear-gradient(transparent 74%, #5B4632 74%, #3E2F22 100%),
  repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 18%, rgba(255,255,255,.12) 18% 18.5%),
  linear-gradient(#1D2648, #2B3561); }
.bg-street { background:
  linear-gradient(transparent 80%, #9AA3B5 80%, #8790A3 100%),
  linear-gradient(90deg, #6F7FA6 0 12%, transparent 12% 15%, #5B6B93 15% 31%, transparent 31% 36%, #7889B0 36% 50%, transparent 50% 58%, #5E6E98 58% 75%, transparent 75% 80%, #7182AB 80% 100%) 0 100% / 100% 62% no-repeat,
  linear-gradient(#9FD0FF, #DDEFFF); }
.bg-room { background:
  linear-gradient(transparent 78%, #E8C9A6 78%, #D9B48B 100%),
  radial-gradient(circle at 78% 26%, #FFD23F 0 3%, transparent 3.2%),
  linear-gradient(90deg, transparent 64%, #fff 64% 90%, transparent 90%) 0 14% / 100% 30% no-repeat,
  linear-gradient(#FBE3EE, #F3D3E6); }
.bg-stage { background:
  radial-gradient(ellipse 18% 70% at 22% 0%, rgba(255,240,170,.45), transparent 70%),
  radial-gradient(ellipse 18% 70% at 78% 0%, rgba(255,140,190,.40), transparent 70%),
  radial-gradient(circle at 10% 92%, #FFD23F 0 .6%, transparent .8%), radial-gradient(circle at 24% 95%, #FF8FB5 0 .6%, transparent .8%),
  radial-gradient(circle at 40% 91%, #FFD23F 0 .6%, transparent .8%), radial-gradient(circle at 56% 96%, #9AD9F5 0 .6%, transparent .8%),
  radial-gradient(circle at 72% 92%, #FFD23F 0 .6%, transparent .8%), radial-gradient(circle at 88% 95%, #FF8FB5 0 .6%, transparent .8%),
  linear-gradient(transparent 70%, #3A2560 70%, #22163D 100%),
  linear-gradient(#1A1534, #3B2B6B); }

.bg-street::before { content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: 20%; width: min(44%, 520px); height: 62%;
  background: radial-gradient(circle, #FFE9A8 0 7px, transparent 8px) 10px 64px / 46px 50px, #8E7CC3; border: 4px solid var(--ink); border-bottom: 0; border-radius: 14px 14px 0 0; }
.bg-street::after { content: '★ 반짝엔터 3F'; position: absolute; left: 50%; transform: translateX(-50%) rotate(-2deg); bottom: calc(20% + 62% - 52px); font-family: var(--display); font-size: 1.3rem; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 2px 16px; white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }

/* 무대 위 멤버 카드 */
.cast { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
.mcard {
  position: absolute; bottom: 150px; width: min(40vw, 46vh); aspect-ratio: 3 / 4;
  border: 4px solid var(--ink); border-radius: 26px; overflow: hidden; background: var(--mc, #fff);
  box-shadow: 0 8px 0 var(--ink); transition: transform .25s ease, filter .25s ease, opacity .25s;
}
.mcard::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.75), rgba(255,255,255,0) 65%); }
.mcard img { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 96%; width: auto; max-width: none; }
.mcard.main { left: 6%; z-index: 2; }
.mcard.side { right: 6%; z-index: 1; transform: scale(.86); transform-origin: bottom right; filter: saturate(.35) brightness(.92); }
.mcard.dimmed { filter: saturate(.35) brightness(.92); }
.mcard.enter { animation: popin .3s ease; }
@keyframes popin { from { transform: translateY(16px) scale(.96); opacity: 0; } }
.mcard.npc svg { position: absolute; left: 50%; bottom: -4%; transform: translateX(-50%); width: 104%; height: auto; }
.mcard .tag { position: absolute; left: 10px; top: 10px; z-index: 2; font-family: var(--display); font-size: 1rem; padding: 2px 12px; border-radius: 999px; background: var(--white); border: 3px solid var(--ink); color: var(--ink); }

/* 웹툰 컷 */
.cutpanel {
  position: absolute; left: 50%; top: 3%; transform: translateX(-50%); height: calc(100% - 232px); aspect-ratio: 800 / 446; max-width: 94%;
  border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 8px 0 var(--ink); background: #000; animation: popin .3s ease;
}
.cutpanel img { width: 100%; height: 100%; object-fit: cover; }

.ribbon { position: absolute; top: 12px; right: 12px; z-index: 4; font-family: var(--display); background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 14px; transform: rotate(2deg); box-shadow: 0 3px 0 var(--ink); }

/* 대화창 */
.dialog {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3; min-height: 172px; max-width: 1180px; margin: 0 auto;
  background: var(--white); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink);
  padding: 30px 22px 18px; display: flex; gap: 16px; align-items: flex-start; cursor: pointer;
}
.dialog .nametag { position: absolute; left: 22px; top: -22px; font-family: var(--display); font-size: 1.2rem; color: var(--white); background: var(--c, var(--ink)); border: 3px solid var(--ink); border-radius: 999px; padding: 2px 18px; }
.dialog .avatar { flex: none; }
.dialog .text { flex: 1; font-size: 1.35rem; line-height: 1.6; font-weight: 500; word-break: keep-all; overflow-wrap: anywhere; min-height: 3.2em; }
.dialog.narr .text { color: var(--ink2); font-style: normal; }
.dialog.narr { background: #F7F9FD; }
.dialog.paper { background: #FFFBEA; background-image: repeating-linear-gradient(transparent 0 1.55em, #EADFB5 1.55em calc(1.55em + 1px)); }
.dialog.paper .text { font-family: var(--display); font-size: 1.4rem; }
.dlg-ctrl { position: absolute; right: 14px; bottom: 8px; display: flex; gap: 10px; align-items: center; }
.dlg-ctrl .prev { border: none; background: transparent; color: var(--ink2); font-size: .9rem; padding: 8px; min-height: 40px; }
.dlg-ctrl .next { font-size: 1.1rem; color: var(--pink); animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }

.avatar-c { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); overflow: hidden; background: var(--ac, #fff); display: grid; place-items: center; flex: none; }
.avatar-c img { width: 100%; height: 100%; object-fit: cover; }
.avatar-c svg { width: 118%; height: 118%; margin-top: 18%; }
.avatar-c.sm { width: 56px; height: 56px; border-width: 2.5px; }
.avatar-c .emo { font-size: 2.2rem; }

/* ===== 미션 ===== */
.mission-wrap { position: absolute; inset: 0; overflow-y: auto; padding: 18px 14px 28px; -webkit-overflow-scrolling: touch; }
.sheet {
  max-width: 1040px; margin: 0 auto; background: var(--white); border: 4px solid var(--ink); border-radius: 22px;
  box-shadow: 0 6px 0 var(--ink); padding: 18px 20px 20px; position: relative;
}
.sheet::before, .sheet::after { content: ''; position: absolute; top: -14px; width: 92px; height: 26px; background: rgba(255,210,63,.75); border: 2px solid rgba(28,43,74,.25); }
.sheet::before { left: 30px; transform: rotate(-4deg); } .sheet::after { right: 30px; transform: rotate(3deg); }
.m-head { display: flex; align-items: center; gap: 14px; }
.m-head .mascot { width: 70px; height: 74px; object-fit: contain; flex: none; }
.m-head .mno { font-family: var(--display); color: var(--pink); font-size: 1rem; }
.m-head h2 { font-family: var(--display); font-weight: 400; font-size: 1.7rem; margin: 0; line-height: 1.15; }
.m-head .steps { margin-left: auto; font-family: var(--display); background: var(--blue-soft); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-size: .95rem; white-space: nowrap; }
.m-who { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0 16px; }
.bubble { position: relative; background: var(--blue-soft); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 16px; font-size: 1.15rem; line-height: 1.55; flex: 1; font-weight: 500; word-break: keep-all; }
.bubble::before { content: ''; position: absolute; left: -12px; top: 22px; width: 18px; height: 18px; background: var(--blue-soft); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
.m-foot { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.sheet .m-foot { position: sticky; bottom: -28px; z-index: 3; background: var(--white); padding: 12px 0 16px; margin-bottom: -8px; border-top: 2px dashed var(--line); }
.m-foot .total { flex: 1 1 360px; margin-top: 0; }
.hint-line { text-align: center; color: var(--ink2); font-size: .95rem; margin-top: 8px; min-height: 1.4em; }

/* 카드 · 상자 */
.pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 12px; border: 3px dashed var(--line); border-radius: 16px; min-height: 76px; background: #FAFCFF; }
.pool:empty::after { content: '카드를 모두 담았어요'; color: var(--ink2); align-self: center; font-size: .95rem; }
.chip {
  border: 3px solid var(--ink); background: var(--white); border-radius: 14px; padding: 10px 14px; font-size: 1.05rem; font-weight: 600;
  box-shadow: 0 3px 0 var(--ink); min-height: 52px; text-align: left; line-height: 1.35; word-break: keep-all; transition: transform .1s;
}
.chip.sel { background: var(--yellow); transform: translateY(-3px); box-shadow: 0 6px 0 var(--ink); }
.chip.ok { background: var(--green-soft); border-color: var(--green); box-shadow: 0 3px 0 var(--green); color: #12583A; cursor: default; }
.chip.ok::before { content: '✓ '; font-weight: 800; }
.chip.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.chip .who { display: block; font-size: .85rem; color: var(--ink2); font-weight: 500; }
.bins { display: grid; gap: 12px; margin-top: 14px; }
.bins.bins3, .bins.judge { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.bins.flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bins.timeline { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.bin { border: 3px solid var(--ink); border-radius: 16px; background: var(--blue-soft); padding: 10px; min-height: 130px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.bin.target { outline: 4px solid var(--yellow); outline-offset: 2px; background: #FFF8D6; }
.bin h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.25rem; text-align: center; }
.bin .chip { width: 100%; }
.bins.flow .bin, .bins.timeline .bin { min-height: 104px; }
.bins.flow .bin h3 { font-size: 1.05rem; }
.bins.flow .bin h3::after { content: ''; display: block; height: 3px; background: var(--ink); margin: 6px 20% 0; border-radius: 2px; }
.bin .slot { flex: 1; border: 2px dashed var(--ink2); border-radius: 12px; display: grid; place-items: center; color: var(--ink2); font-size: .9rem; min-height: 54px; }

/* 고르기 */
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 3px solid var(--ink); background: var(--white); border-radius: 16px; padding: 12px 16px; font-size: 1.12rem; font-weight: 600; box-shadow: 0 3px 0 var(--ink); min-height: 58px; line-height: 1.4; word-break: keep-all; }
.opt .mark { flex: none; width: 30px; height: 30px; border: 3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: .95rem; background: var(--white); }
.opts.multi .opt .mark { border-radius: 8px; }
.opt.sel { background: #FFF6CC; }
.opt.sel .mark { background: var(--pink); color: var(--white); }
.opt.sel .mark::after { content: '✓'; }

/* 티켓값 */
.fans { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; align-items: end; }
.fan { text-align: center; }
.fan svg { width: 100%; max-width: 64px; margin: 0 auto; }
.fan .will { font-size: .8rem; font-weight: 700; background: var(--white); border: 2px solid var(--ink); border-radius: 8px; padding: 1px 2px; margin-bottom: 4px; white-space: nowrap; }
.fan.buy .will { background: var(--yellow); }
.prices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 8px; }
.price-btn { border: 3px solid var(--ink); background: var(--white); border-radius: 12px; padding: 8px 14px; font-family: var(--display); font-size: 1.1rem; box-shadow: 0 3px 0 var(--ink); min-height: 50px; }
.price-btn.sel { background: var(--pink); color: var(--white); }
.price-btn.tried::after { content: ' •'; color: var(--green); }
.price-btn.sel.tried::after { color: var(--white); }
.readout { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.readout .box { border: 3px solid var(--ink); border-radius: 14px; padding: 8px 16px; background: #FAFCFF; text-align: center; min-width: 150px; }
.readout .box small { display: block; color: var(--ink2); font-size: .85rem; }
.readout .box b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }
.history { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; font-size: .9rem; color: var(--ink2); }
.history span { background: var(--blue-soft); border-radius: 8px; padding: 2px 8px; }

/* 예산 */
.budget-rows { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: minmax(150px, 1fr) 2fr; gap: 10px; align-items: center; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; }
.brow .bname { font-weight: 700; font-size: 1.1rem; display: flex; gap: 8px; align-items: center; }
.brow .bname em { font-style: normal; font-size: .8rem; color: var(--pink); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 3px solid var(--ink); background: var(--white); border-radius: 12px; padding: 6px 4px; min-height: 52px; font-weight: 700; line-height: 1.2; }
.seg button small { display: block; font-weight: 500; font-size: .8rem; color: var(--ink2); }
.seg button.sel { background: var(--blue); color: var(--white); }
.seg button.sel small { color: #DCE6FF; }
.total { margin-top: 14px; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; }
.total .row { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; }
.total .row b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
.total .row b.over { color: var(--red); }
.tbar { position: relative; height: 18px; border: 2px solid var(--ink); border-radius: 9px; background: #F1F4FA; overflow: hidden; margin-top: 6px; }
.tbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); transition: width .3s; }
.tbar i.over { background: var(--red); }

/* 쇼핑 */
.shop-sec { margin-top: 12px; }
.shop-sec h4 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 1.2rem; }
.crit { display: flex; flex-wrap: wrap; gap: 8px; }
.crit button { border: 3px solid var(--ink); background: var(--white); border-radius: 999px; padding: 8px 16px; font-weight: 700; min-height: 48px; }
.crit button.sel { background: var(--blue); color: var(--white); }
.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.item { border: 3px solid var(--ink); border-radius: 16px; background: var(--white); padding: 10px; text-align: center; box-shadow: 0 3px 0 var(--ink); }
.item .ic { font-size: 2.2rem; }
.item b { display: block; font-size: 1.05rem; }
.item .pr { font-family: var(--display); font-size: 1.2rem; color: var(--pink); }
.item small { display: block; color: var(--ink2); font-size: .85rem; line-height: 1.35; margin-top: 4px; word-break: keep-all; }
.item.sel { background: #FFF6CC; transform: translateY(-3px); box-shadow: 0 6px 0 var(--ink); }
.wallet { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-weight: 700; }
.wallet .tbar { flex: 1; margin: 0; }

/* 근로계약서 */
.contract { max-width: 640px; margin: 0 auto; background: #FFFEF7; border: 3px solid var(--ink); border-radius: 8px; padding: 18px 22px; box-shadow: 6px 6px 0 rgba(28,43,74,.15); }
.contract h3 { text-align: center; font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0 0 12px; letter-spacing: .1em; }
.crow { display: grid; grid-template-columns: 9em 1fr; gap: 10px; align-items: center; border-bottom: 2px solid #E7E2CC; padding: 8px 0; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; font-size: 1.1rem; min-height: 54px; }
.crow .cl { font-weight: 700; }
.crow .cv { color: var(--ink); }
.crow .blank { display: inline-block; min-width: 60%; border-bottom: 2px dotted var(--ink2); height: 1.3em; position: relative; }
.crow.mark .blank::after { content: '빠졌어요!'; position: absolute; left: 0; top: -12px; border: 3px solid var(--red); color: var(--red); border-radius: 50%; padding: 4px 14px; font-weight: 800; transform: rotate(-6deg); background: rgba(255,255,255,.7); white-space: nowrap; }
.crow .filled { color: var(--blue); font-weight: 700; }

/* 일정표 */
.sched-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sched-ctrl h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.day { border: 3px solid var(--ink); border-radius: 12px; text-align: center; padding: 6px 2px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; }
.day b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.day.work { background: var(--pink-soft); }
.day.rest { background: var(--green-soft); }
.day span { font-size: .9rem; font-weight: 700; }
.week-total { text-align: center; margin-top: 10px; font-size: 1.1rem; font-weight: 700; }
.week-total b { font-family: var(--display); font-weight: 400; font-size: 1.7rem; }
.btn.danger { background: #FFE9D6; }

/* 순서 */
.order-slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.oslot { border: 3px dashed var(--ink2); border-radius: 16px; min-height: 100px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: #FAFCFF; text-align: left; font-weight: 700; font-size: 1.02rem; line-height: 1.35; word-break: keep-all; }
.oslot .n { font-family: var(--display); font-weight: 400; color: var(--pink); font-size: 1.3rem; }
.oslot.full { border-style: solid; border-color: var(--ink); background: #FFF6CC; }
.order-pool { margin-top: 12px; }

/* 이름 */
.names { display: grid; gap: 14px; max-width: 620px; margin: 0 auto; }
.names label { font-family: var(--display); font-size: 1.25rem; display: grid; gap: 6px; }
.names input { font: inherit; font-size: 1.4rem; padding: 12px 16px; border: 3px solid var(--ink); border-radius: 14px; width: 100%; font-family: var(--body); font-weight: 700; user-select: text; -webkit-user-select: text; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .95rem; color: var(--ink2); }
.sugg button { border: 2px solid var(--ink); background: var(--blue-soft); border-radius: 999px; padding: 6px 14px; font-weight: 700; min-height: 44px; }

/* ===== 창(모달) ===== */
#modal:empty { display: none; }
.modal-back { position: fixed; inset: 0; background: rgba(20,28,52,.55); display: grid; place-items: center; z-index: 50; padding: 16px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--white); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); padding: 20px; animation: popin .25s ease; }
.modal h2 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0 0 10px; text-align: center; }
.modal.ok h2 { color: var(--green); }
.modal.no h2 { color: var(--red); }
.fb-line { display: flex; gap: 12px; align-items: flex-start; }
.fb-line .bubble { font-size: 1.15rem; }
.fb-line .bubble.narr { background: #F3F5FA; }
.modal-btns { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.deltas { display: flex; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.deltas span { font-family: var(--display); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; }
.deltas .up { background: var(--green-soft); } .deltas .down { background: var(--red-soft); }
.menu-list { display: grid; gap: 10px; }

/* ===== 포카 ===== */
.poca-stage { display: grid; place-items: center; perspective: 900px; margin: 6px 0; }
.poca { width: 210px; aspect-ratio: 5 / 7.4; position: relative; transform-style: preserve-3d; transition: transform .6s; cursor: pointer; }
.poca.flip { transform: rotateY(180deg); }
.poca .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 4px solid var(--ink); border-radius: 16px; overflow: hidden; }
.poca .front { background: linear-gradient(120deg, #FFD6E7, #D9E8FF 30%, #FFF4C2 52%, #D6FFF0 72%, #E9D6FF); background-size: 260% 260%; animation: holo 4s linear infinite; display: flex; flex-direction: column; }
@keyframes holo { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
.poca .front .ph { flex: 1; margin: 10px 10px 0; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--white); position: relative; }
.poca .front .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.poca .front .word { font-family: var(--display); font-size: 1.55rem; text-align: center; padding: 8px 6px 10px; line-height: 1.1; word-break: keep-all; }
.poca .front .no { position: absolute; top: 16px; right: 16px; z-index: 1; font-family: var(--display); font-size: .85rem; background: var(--white); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; }
.poca .back { transform: rotateY(180deg); background: var(--white); padding: 16px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; }
.poca .back b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--pink); }
.poca .back p { margin: 0; font-size: 1rem; line-height: 1.55; word-break: keep-all; }
.flip-hint { text-align: center; color: var(--ink2); font-size: .95rem; margin-top: 6px; }

/* 도감 */
.page { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.page-head { display: flex; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto 14px; flex-wrap: wrap; }
.page-head h2 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 0; flex: 1; }
.tabs { display: flex; gap: 8px; }
.tabs button { border: 3px solid var(--ink); background: var(--white); border-radius: 999px; padding: 6px 16px; font-family: var(--display); font-size: 1.05rem; min-height: 46px; }
.tabs button.sel { background: var(--ink); color: var(--white); }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
.dex .poca { width: 100%; }
.dex .poca .front .word { font-size: 1.2rem; }
.dex .poca .back p { font-size: .88rem; }
.dex .poca .back b { font-size: 1.2rem; }
.locked { word-break: keep-all; aspect-ratio: 5 / 7.4; border: 4px dashed var(--line); border-radius: 16px; display: grid; place-items: center; text-align: center; color: var(--ink2); background: rgba(255,255,255,.6); font-family: var(--display); font-size: 1.05rem; padding: 10px; }
.locked big { display: block; font-size: 2.4rem; }
.stories { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
.story { border: 3px solid var(--ink); border-radius: 18px; background: var(--white); padding: 14px; display: flex; gap: 12px; align-items: center; text-align: left; box-shadow: 0 4px 0 var(--ink); }
.story.off { border-style: dashed; box-shadow: none; background: rgba(255,255,255,.6); color: var(--ink2); }
.story b { font-family: var(--display); font-weight: 400; font-size: 1.2rem; display: block; }
.story small { font-size: .9rem; }

/* 장 고르기 */
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }
.chap { border: 3px solid var(--ink); border-radius: 18px; background: var(--white); padding: 16px; text-align: left; box-shadow: 0 4px 0 var(--ink); display: grid; gap: 4px; }
.chap .no { font-family: var(--display); color: var(--pink); font-size: 1.1rem; }
.chap b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; line-height: 1.2; }
.chap small { color: var(--ink2); }
.chap .st { margin-top: 6px; font-weight: 700; font-size: .95rem; }
.chap.done { background: var(--green-soft); }
.chap.now { background: #FFF6CC; }

/* 장 끝 · 결과 */
.endcard { max-width: 760px; margin: 0 auto; text-align: center; }
.endcard h2 { font-family: var(--display); font-weight: 400; font-size: 2.6rem; margin: 6px 0; }
.mini-pocas { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0; }
.mini-pocas .poca { width: 120px; }
.mini-pocas .poca .front .word { font-size: 1.05rem; }
.unlock { border: 3px solid var(--ink); border-radius: 16px; background: #FFF6CC; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 12px 0; font-weight: 700; }
.result { max-width: 680px; margin: 0 auto; background: var(--white); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; }
.result .top { background: linear-gradient(#26305A, #4B2E74); color: var(--white); padding: 18px; text-align: center; }
.result .top small { color: var(--yellow); font-family: var(--display); font-size: 1.1rem; }
.result .top h2 { font-family: var(--display); font-weight: 400; font-size: 2.1rem; margin: 4px 0; }
.result .top .grp { font-size: 1.1rem; }
.result .lineup { width: 80%; margin: 8px auto 0; }
.result dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; padding: 16px 22px; margin: 0; font-size: 1.1rem; }
.result dt { color: var(--ink2); }
.result dd { margin: 0; font-weight: 700; }
.result .gsum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 22px 18px; }
.result .gsum div { border: 2px solid var(--ink); border-radius: 12px; text-align: center; padding: 6px; }
.result .gsum b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; display: block; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; pointer-events: none; }
#toast div { background: var(--ink); color: var(--white); padding: 10px 18px; border-radius: 14px; font-weight: 700; animation: popin .2s; box-shadow: 0 4px 0 rgba(0,0,0,.25); }

/* ===== 세로 화면, 작은 화면 ===== */
@media (max-width: 900px) {
  .gauge { width: 70px; }
  .gauge .gn span { display: none; }
  .hud-ch span { display: none; }
  .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bins.timeline { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .order-slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  html { font-size: 15px; }
  .hud { gap: 6px; padding: 6px 8px; } .icon-btn { min-width: 42px; min-height: 42px; padding: 0 6px; }
  .gauges { gap: 5px; } .gauge { width: 40px; } .gauge .gn { display: none; } .gauge .gi { grid-row: auto; font-size: 1rem; } .gauge { grid-template-columns: 1fr; }
  .bins.bins3, .bins.judge { grid-template-columns: 1fr; }
  .bins.flow { grid-template-columns: 1fr; }
  .bins.timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fans { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .brow { grid-template-columns: 1fr; }
  .sched-ctrl { grid-template-columns: 1fr; }
  .week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .avatar-c { width: 56px; height: 56px; }
  .mcard { width: min(52vw, 40vh); }
}
@media (orientation: portrait) {
  .mcard { width: min(60vw, 38vh); }
  .mcard.main { left: 50%; transform: translateX(-50%); }
  .mcard.main.enter { animation: none; }
  .mcard.side { display: none; }
}
.mcard.npc.main { width: min(32vw, 40vh); }
@media (orientation: portrait) { .mcard.npc.main { width: min(48vw, 30vh); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function eyesFor(mood, kid) {
  const ink = '#2A2230';
  const ey = 110, lx = 80, rx = 120;
  const big = kid ? 1.15 : 1;
  const open = (x, s = 1) => `<ellipse cx="${x}" cy="${ey}" rx="${6 * s * big}" ry="${8 * s * big}" fill="${ink}"/><circle cx="${x + 2}" cy="${ey - 3}" r="${2.2 * big}" fill="#fff"/>`;
  const arc = x => `<path d="M${x - 7} ${ey + 2} Q${x} ${ey - 7} ${x + 7} ${ey + 2}" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  const lid = x => `<path d="M${x - 7} ${ey} L${x + 7} ${ey}" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/><path d="M${x - 5} ${ey + 3} Q${x} ${ey + 7} ${x + 5} ${ey + 3}" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  let e = '';
  if (mood === 'happy') e = arc(lx) + arc(rx);
  else if (mood === 'tired') e = lid(lx) + lid(rx);
  else if (mood === 'surprised') e = open(lx, 1.2) + open(rx, 1.2);
  else if (mood === 'smirk') e = open(lx, 0.9) + lid(rx);
  else e = open(lx) + open(rx);
  let b = '';
  const bs = `stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"`;
  if (mood === 'worried' || mood === 'sad' || mood === 'tired') b = `<path d="M71 97 L86 92" ${bs}/><path d="M114 92 L129 97" ${bs}/>`;
  else if (mood === 'angry') b = `<path d="M71 91 L87 98" ${bs}/><path d="M113 98 L129 91" ${bs}/>`;
  else if (mood === 'surprised') b = `<path d="M72 90 Q79 85 86 90" ${bs}/><path d="M114 90 Q121 85 128 90" ${bs}/>`;
  else if (mood === 'smirk') b = `<path d="M72 95 L86 94" ${bs}/><path d="M114 92 L128 96" ${bs}/>`;
  else b = `<path d="M72 95 Q79 92 86 95" ${bs}/><path d="M114 95 Q121 92 128 95" ${bs}/>`;
  return b + e;
}

  const ink = '#7A2E3A';
  switch (mood) {
    case 'happy': return `<path d="M87 129 Q100 146 113 129 Z" fill="#C2475A" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>`;

function collarFor(c) {
  const o = c.outfit;
  let s = `<path d="M34 240 C34 194 62 172 100 172 C138 172 166 194 166 240 Z" fill="${o}" stroke="#1C2B4A" stroke-width="3"/>`;
  if (c.collar === 'tee') s += `<path d="M84 174 Q100 190 116 174" fill="none" stroke="${shade(o, -50)}" stroke-width="3"/>`;
  if (c.collar === 'hoodie') s += `<path d="M70 176 Q100 204 130 176" fill="${shade(o, -20)}" stroke="#1C2B4A" stroke-width="3"/><path d="M92 196 L90 220 M108 196 L110 220" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  if (c.collar === 'blazer') s += `<path d="M86 174 L100 210 L114 174" fill="#fff" stroke="#1C2B4A" stroke-width="2.5"/><path d="M78 176 L100 226 L76 236 M122 176 L100 226 L124 236" fill="none" stroke="${shade(o, -40)}" stroke-width="3"/>`;
  if (c.collar === 'suit') s += `<path d="M84 174 L100 206 L116 174" fill="#fff" stroke="#1C2B4A" stroke-width="2.5"/><path d="M76 176 L100 230 M124 176 L100 230" fill="none" stroke="${shade(o, 40)}" stroke-width="3"/>`;
  if (c.tie) s += `<path d="M96 186 L104 186 L107 220 L100 230 L93 220 Z" fill="${c.tie}" stroke="#1C2B4A" stroke-width="2"/>`;
  if (c.badge) s += `<rect x="122" y="200" width="22" height="14" rx="3" fill="#FFD23F" stroke="#1C2B4A" stroke-width="2"/>`;
  return s;
}

function portraitSVG(id, mood = 'normal') {
  const c = CAST[id];
  if (!c || !c.skin) return '';
  const h = HAIR[c.style] || HAIR.short;
  const hair = c.hair, hs = shade(hair, -25);
  let s = `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  if (h.back) s += `<path d="${h.back}" fill="${hair}" stroke="#1C2B4A" stroke-width="3" stroke-linejoin="round"/>`;
  s += collarFor(c);
  s += `<rect x="88" y="146" width="24" height="34" fill="${shade(c.skin, -18)}"/>`;
  s += `<circle cx="48" cy="112" r="10" fill="${c.skin}" stroke="#1C2B4A" stroke-width="3"/><circle cx="152" cy="112" r="10" fill="${c.skin}" stroke="#1C2B4A" stroke-width="3"/>`;
  s += `<ellipse cx="100" cy="104" rx="53" ry="57" fill="${c.skin}" stroke="#1C2B4A" stroke-width="3"/>`;
  s += `<ellipse cx="72" cy="126" rx="9" ry="4.5" fill="#FF8FA8" opacity=".5"/><ellipse cx="128" cy="126" rx="9" ry="4.5" fill="#FF8FA8" opacity=".5"/>`;
  s += eyesFor(mood, c.kid);
  s += `<path d="M101 116 Q97 122 102 123" stroke="${shade(c.skin, -60)}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if (c.mustache) s += `<path d="M86 126 Q93 120 100 125 Q107 120 114 126 Q107 129 100 127 Q93 129 86 126 Z" fill="${hair}"/>`;
  s += mouthFor(mood);
  if (h.extra) s += `<g fill="${hair}" stroke="#1C2B4A" stroke-width="3">${h.extra}</g>`;
  s += `<path d="${h.front}" fill="${hair}" stroke="#1C2B4A" stroke-width="3" stroke-linejoin="round"/>`;
  if (c.style === 'slick') s += `<path d="M70 52 Q100 44 132 54 M64 62 Q100 52 140 64" stroke="${hs}" stroke-width="3" fill="none"/>`;
  if (c.style === 'ponytail') s += `<circle cx="140" cy="66" r="7" fill="#FF3D7F" stroke="#1C2B4A" stroke-width="2.5"/>`;
  if (c.pin) s += `<path d="M132 72 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1 Z" fill="#FFD23F" stroke="#1C2B4A" stroke-width="2"/>`;
  if (c.glasses) s += `<g fill="none" stroke="#1C2B4A" stroke-width="3"><rect x="66" y="99" width="28" height="22" rx="8"/><rect x="106" y="99" width="28" height="22" rx="8"/><path d="M94 108 L106 108"/></g>`;
  if (c.earring) s += `<circle cx="152" cy="126" r="4" fill="#FFD23F" stroke="#1C2B4A" stroke-width="2"/>`;
  if (c.headset) s += `<path d="M44 112 C40 40 160 40 156 112" fill="none" stroke="#2A2230" stroke-width="7"/><rect x="38" y="102" width="14" height="24" rx="6" fill="#2A2230"/><rect x="148" y="102" width="14" height="24" rx="6" fill="#2A2230"/><path d="M45 124 Q52 142 76 140" stroke="#2A2230" stroke-width="4" fill="none"/><circle cx="78" cy="140" r="4" fill="#2A2230"/>`;
  s += `</svg>`;
  return s;
}

function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hasBatchim(w) {
  const ch = w.trim().slice(-1); if (!ch) return false; const c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0;
  if (/[0-9]/.test(ch)) return '013678'.includes(ch);
  if (/[a-zA-Z]/.test(ch)) return /(l|m|n|ng)$/i.test(w.trim());
  return false;
}
function isRieul(w) { const c = w.trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 === 8; }
function josa(w, j) {
  const b = hasBatchim(w);
  switch (j) {
    case '은': return b ? '은' : '는';
    case '이': return b ? '이' : '가';
    case '을': return b ? '을' : '를';
    case '과': return b ? '과' : '와';
    case '으로': return (b && !isRieul(w)) ? '으로' : '로';
    default: return '';
  }
}

}
function refreshHud() {
  const g = gaugeVals();

    const k = el.dataset.g; el.querySelector('.bar i').style.width = g[k] + '%'; el.querySelector('.gn b').textContent = g[k];

/* ---------- 알림, 창 ---------- */
function toast(msg, ms = 2200) {

function closeModal() { $modal.innerHTML = ''; }
function modal(html, cls = '') {

function confirmBox(msg, yes, no = '취소') {

/* 여러 줄 대사를 창에서 차례로 보여 주기 */
function talkModal({ title, cls, lines, deltas, lastBtn = '계속', onDone }) {
  let i = 0;
  const draw = () => {
    const [who, mood, text] = lines[i];

      <div class="fb-line">${who !== 'narr' ? avatarHTML(who, mood) : ''}<div class="bubble ${who === 'narr' ? 'narr' : ''}">${who !== 'narr' && speakerName(who) ? `<b style="font-family:var(--display);font-weight:400;color:${(CAST[who] || {}).color || 'inherit'}">${esc(speakerName(who))}</b><br>` : ''}${T(text)}</div></div>
      ${last && deltas ? deltas : ''}
      <div class="modal-btns"><button class="btn ${last ? 'primary' : ''}" data-a="next">${last ? lastBtn : '다음'}</button></div>`, cls);
    m.querySelector('[data-a=next]').onclick = () => { if (last) { closeModal(); onDone && onDone(); } else { i++; draw(); } };

}

/* ===================== 화면: 장 고르기 ===================== */
function chapterStatus(ch) {
  const ids = ch.nodes.filter(n => n.type === 'mission').map(n => n.id);
  const done = ids.filter(id => S.res[id] && S.res[id].done).length;
  const pocas = ch.nodes.filter(n => n.type === 'mission').reduce((a, n) => a + n.pocas.length, 0);
  const got = ch.nodes.filter(n => n.type === 'mission' && S.res[n.id] && S.res[n.id].done).reduce((a, n) => a + n.pocas.length, 0);
  return { ids, done, total: ids.length, pocas, got, finished: S.done.includes(ch.no) };
}
function renderSelect() {
  closeModal();
  $app.innerHTML = `<div class="page"><div class="page-head"><h2>장 고르기</h2><button class="btn small" data-back>처음 화면</button></div>
    <div class="chapters">${CHAPTERS.map(ch => {
      const st = chapterStatus(ch); const now = S.cur && S.cur.ch === ch.no && !st.finished;
      return `<button class="chap ${st.finished ? 'done' : now ? 'now' : ''}" data-ch="${ch.no}">
        <span class="no">${ch.no}장 · ${ch.no}차시</span><b>${esc(ch.title)}</b><small>${esc(ch.topic)}</small>
        <span class="st">${st.finished ? '✓ 다 했어요' : now ? '▶ 하는 중' : '아직 안 했어요'} · 포카 ${st.got}/${st.pocas}</span></button>`;
    }).join('')}</div></div>`;
  $app.querySelector('[data-back]').onclick = renderTitle;
  $app.querySelectorAll('[data-ch]').forEach(b => b.onclick = async () => {
    const no = +b.dataset.ch; const ch = CHAPTERS[no - 1]; const st = chapterStatus(ch);
    if (S.cur && S.cur.ch === no && !st.finished && S.cur.node > 0) {
      return playAt(no, S.cur.node);
    }
    if (st.done > 0 || st.finished) {
      const ok = await confirmBox(`${no}장을 처음부터 다시 할까요? 이 장에서 받은 포카와 점수는 새로 매겨져요.`, '다시 하기');
      if (!ok) return;
      st.ids.forEach(id => delete S.res[id]);
      if (no === 5) delete S.flags.nightShift;
      if (no === 6) delete S.flags.collusion;
      S.done = S.done.filter(x => x !== no);
    }
    if (!S.ceo) { S.cur = { ch: no, node: 0 }; return renderNames(() => playAt(no, 0)); }
    playAt(no, 0);
  });
}

/* ===================== 진행 ===================== */
let CUR = { ch: 1, node: 0 };
function playAt(chNo, nodeIdx) {
  closeModal();
  CUR = { ch: chNo, node: nodeIdx };
  S.cur = { ch: chNo, node: nodeIdx }; saveState();
  const ch = CHAPTERS[chNo - 1]; const node = ch.nodes[nodeIdx];
  if (!node) return renderTitle();
  if (node.type === 'scene' || node.type === 'cut') return renderScene(ch, node);
  if (node.type === 'names') {
    if (S.ceo && S.group) return next();
    return renderNames(() => next());
  }
  if (node.type === 'mission') {
    if (S.res[node.id] && S.res[node.id].done) return next();
    return renderMission(ch, node);
  }
  if (node.type === 'end') return renderChapterEnd(ch, node);
  if (node.type === 'ending') return renderEnding();
}
function next() { playAt(CUR.ch, CUR.node + 1); }

/* ---------- 대화 장면 ---------- */
function renderScene(ch, node, onEnd) {
  const bg = node.type === 'cut' ? 'bg-' + (node.bg || 'night') : 'bg-' + (node.bg || 'office');
  $app.innerHTML = hudHTML(ch) + `<main class="stage ${bg}" id="stage">
      <div class="cast" id="cast"></div>
      ${node.type === 'cut' ? `<div class="cutpanel"><img src="${IMG[node.img]}" alt=""></div>` : ''}
      ${node.preview ? '<div class="ribbon">다음 화 예고</div>' : node.label ? `<div class="ribbon">${esc(node.label)}</div>` : ''}
      <div class="dialog" id="dlg" role="button" tabindex="0" aria-label="눌러서 다음 대사 보기">
        <div class="nametag" id="nt"></div><div class="avatar" id="av"></div><div class="text" id="tx" aria-live="polite"></div>
        <div class="dlg-ctrl"><button class="prev" id="prev">◀ 이전</button><span class="next">▼</span></div>
      </div></main>`;
  bindHud(); refreshHud();
  const dlg = document.getElementById('dlg');
  let i = 0, typing = null, full = '', shown = 0, lastMember = null, mainMember = null;
  const showLine = () => {
    const [who, mood, text] = node.lines[i];
    const c = CAST[who] || {};
    full = T(text);
    dlg.className = 'dialog' + (who === 'narr' ? ' narr' : '') + (who === 'uncle' || who === 'letter' ? ' paper' : '');
    const nt = document.getElementById('nt');
    if (who === 'narr') nt.style.display = 'none';
    else { nt.style.display = ''; nt.textContent = c.name || ''; nt.style.setProperty('--c', c.color || 'var(--ink)'); }
    const av = document.getElementById('av');
    const staged = c.member || c.skin;
    const onStage = staged && node.type !== 'cut';
    av.innerHTML = (!onStage && who !== 'narr') ? avatarHTML(who, mood) : '';
    if (node.type !== 'cut') {
      const cast = document.getElementById('cast');
      if (staged) {
        if (mainMember && mainMember !== who) lastMember = mainMember;
        const changed = mainMember !== who;
        mainMember = who;
        cast.innerHTML = stageCard(who, mood, 'main' + (changed ? ' enter' : '')) + (lastMember && lastMember !== who ? stageCard(lastMember, 'normal', 'side') : '');
      } else if (mainMember) {
        cast.querySelectorAll('.mcard').forEach(e => e.classList.add('dimmed'));
      }
    }
    // 글자가 하나씩 나오기
    const plain = full.replace(/&[^;]+;/g, 'x');
    shown = 0; clearInterval(typing);
    const tx = document.getElementById('tx');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { tx.innerHTML = full; typing = null; return; }
    tx.innerHTML = '';
    typing = setInterval(() => {
      shown += 2;
      if (shown >= plain.length) { tx.innerHTML = full; clearInterval(typing); typing = null; return; }
      tx.innerHTML = cutHTML(full, shown);
    }, 32);
    document.getElementById('prev').style.visibility = i > 0 ? 'visible' : 'hidden';
  };
  const advance = () => {
    if (typing) { clearInterval(typing); typing = null; document.getElementById('tx').innerHTML = full; return; }
    if (i < node.lines.length - 1) { i++; showLine(); } else { clearInterval(typing); (onEnd || next)(); }
  };
  let lastTap = 0;
  const onTap = e => {
    if (e.target.closest('button')) return;
    const now = Date.now(); if (now - lastTap < 180) return; lastTap = now;
    advance();
  };
  document.getElementById('stage').addEventListener('click', onTap);
  dlg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); } });
  document.getElementById('prev').onclick = e => { e.stopPropagation(); if (i > 0) { i--; clearInterval(typing); typing = null; showLine(); } };
  showLine();
  dlg.focus({ preventScroll: true });
}
function cutHTML(html, n) { // 태그 없는 글자 n개까지 자르기 (& 기호는 한 글자)
  let out = '', count = 0, k = 0;
  while (k < html.length && count < n) {
    if (html[k] === '&') { const e = html.indexOf(';', k); out += html.slice(k, e + 1); k = e + 1; count++; }
    else { out += html[k]; k++; count++; }
  }
  return out;
}
function stageCard(id, mood, cls) {
  const c = CAST[id];
  if (c.member) return `<figure class="mcard ${cls}" style="--mc:${c.color}26"><span class="tag">${esc(c.name)}</span><img src="${memberImg(id, mood)}" alt="${esc(c.name)}"></figure>`;
  return `<figure class="mcard npc ${cls}" style="--mc:${c.color}22"><span class="tag">${esc(c.name)}</span>${portraitSVG(id, mood)}</figure>`;
}

/* ===================== 미션 ===================== */
const KIND = {};
function renderMission(ch, node) {
  const steps = node.kind === 'steps' ? node.steps : [node];
  let si = 0;
  const r = res(node.id); saveState();
  const draw = () => {
    const st = steps[si];
    const who = st.who || node.who, mood = st.mood || node.mood;
    $app.innerHTML = hudHTML(ch) + `<main class="stage bg-paper"><div class="mission-wrap"><section class="sheet">
      <div class="m-head"><img class="mascot" src="${IMG.chibi_quiz}" alt=""><div><div class="mno">미션 ${node.id}</div><h2>${esc(node.title)}</h2></div>
        ${steps.length > 1 ? `<span class="steps">${si + 1} / ${steps.length}단계</span>` : ''}</div>
      <div class="m-who">${avatarHTML(who, mood)}<p class="bubble">${T(st.prompt)}</p></div>
      <div class="m-body" id="mb"></div>
      <div class="hint-line" id="hl"></div>
      <div class="m-foot" id="mf"></div>
    </section></div></main>`;
    bindHud(); refreshHud();
    const api = {
      wrong(lines, opts = {}) {
        r.wrongs++; if (opts.pen) { r.pen = r.pen || {}; for (const k in opts.pen) r.pen[k] = (r.pen[k] || 0) + opts.pen[k]; }
        if (opts.flag) S.flags[opts.flag] = true;
        saveState(); refreshHud();
        talkModal({ title: '다시 생각해 볼까요?', cls: 'no', lines, lastBtn: '다시 해 보기', onDone: opts.after });
      },
      pass() {
        if (si < steps.length - 1) { si++; toast('좋아요! 다음 단계로 가요.'); draw(); return; }
        finishMission(ch, node);
      },
      who, mood, node
    };
    KIND[st.kind](st, document.getElementById('mb'), document.getElementById('mf'), document.getElementById('hl'), api);
  };
  draw();
}
function finishMission(ch, node) {
  const r = res(node.id); r.done = true; saveState();
  const before = lastG; refreshHud();
  const g = gaugeVals(); const gi = GAUGES.find(x => x.key === node.gauge);
  const d = before ? g[node.gauge] - before[node.gauge] : 0;
  const deltas = `<div class="deltas"><span class="${d >= 0 ? 'up' : 'down'}">${gi.icon} ${gi.name} ${d >= 0 ? '+' : ''}${d}</span>${r.wrongs === 0 ? '<span class="up">⭐ 한 번에 성공!</span>' : ''}</div>`;
  talkModal({ title: '정답!', cls: 'ok', lines: node.ok || [['oh', 'smile', '잘했어요!']], deltas, lastBtn: node.pocas.length ? '포카 받기' : '계속', onDone: () => showPocas(node.pocas, () => next()) });
}

/* --- 고르기 --- */
KIND.choice = (st, mb, mf, hl, api) => {
  let sel = -1;
  mb.innerHTML = `<div class="opts">${st.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="mark"></span><span>${T(o.text)}</span></button>`).join('')}</div>`;
  mf.innerHTML = `<button class="btn primary" id="ck" disabled>이걸로 정하기</button>`;
  const ck = mf.querySelector('#ck');
  mb.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    sel = +b.dataset.i; mb.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b)); ck.disabled = false;
  });
  ck.onclick = () => {
    const o = st.options[sel]; if (!o) return;
    if (o.correct) return api.pass();
    if (o.branch === 'collusion') return api.wrong(o.why, { pen: { rep: -25, money: -5 }, flag: 'collusion' });
    api.wrong(o.why || [[api.who, 'normal', '다시 한번 생각해 볼까요?']]);
  };
};

/* --- 여러 개 고르기 --- */
KIND.multi = (st, mb, mf, hl, api) => {
  const sel = new Set();
  const opts = st.options || api.node.options;
  mb.innerHTML = `<div class="opts multi">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="mark"></span><span>${T(o.text)}</span></button>`).join('')}</div>`;
  mf.innerHTML = `<button class="btn primary" id="ck" disabled>다 골랐어요</button>`;
  hl.textContent = '맞는 것을 모두 골라요. 하나만 정답이 아닐 수도 있어요.';
  const ck = mf.querySelector('#ck');
  mb.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle('sel', sel.has(i)); ck.disabled = sel.size === 0;
  });
  ck.onclick = () => {
    const bad = [...sel].map(i => opts[i]).find(o => !o.correct);
    if (bad) return api.wrong(bad.why || [[api.who, 'normal', '정답이 아닌 것이 섞여 있어요.']]);
    const miss = opts.some((o, i) => o.correct && !sel.has(i));
    if (miss) return api.wrong(st.missing || api.node.missing || [[api.who, 'normal', '맞는 것이 더 있어요.']]);
    api.pass();
  };
};

/* --- 나눠 담기 (카드 → 상자) --- */
KIND.sort = (st, mb, mf, hl, api) => {
  const place = {}; const locked = new Set(); let selected = null;
  const capped = st.bins.every(b => b.cap);
  const cardById = id => st.cards.find(c => c.id === id);
  const chip = c => `<button class="chip ${locked.has(c.id) ? 'ok' : ''} ${selected === c.id ? 'sel' : ''}" data-c="${c.id}">${T(c.text)}</button>`;
  const draw = () => {
    const pool = st.cards.filter(c => !place[c.id]);
    mb.innerHTML = `<div class="pool" id="pool">${pool.map(c => chip(c)).join('')}</div>
      <div class="bins ${st.layout || 'bins3'}">${st.bins.map(b => {
        const inside = st.cards.filter(c => place[c.id] === b.id);
        return `<button class="bin ${selected ? 'target' : ''}" data-b="${b.id}"><h3>${esc(b.label)}</h3>${inside.map(c => chip(c)).join('')}${b.cap && !inside.length ? '<span class="slot">여기에 넣기</span>' : ''}</button>`;
      }).join('')}</div>`;
    const full = capped ? st.bins.every(b => st.cards.some(c => place[c.id] === b.id)) : pool.length === 0;
    mf.innerHTML = `<button class="btn primary" id="ck" ${full ? '' : 'disabled'}>다 담았어요</button>`;
    hl.textContent = selected ? '이제 넣을 상자를 눌러 주세요.' : (full ? '' : '카드를 먼저 눌러 고르세요. 담은 카드를 다시 누르면 빼낼 수 있어요.');
    mb.querySelectorAll('.chip').forEach(el => el.onclick = e => {
      e.stopPropagation(); const id = el.dataset.c; if (locked.has(id)) return;
      if (place[id]) { delete place[id]; selected = id; } else selected = selected === id ? null : id;
      draw();
    });
    mb.querySelectorAll('.bin').forEach(el => el.onclick = () => {
      if (!selected) { hl.textContent = '먼저 카드를 하나 눌러 주세요.'; return; }
      const b = st.bins.find(x => x.id === el.dataset.b);
      if (b.cap) { const occ = st.cards.find(c => place[c.id] === b.id); if (occ) { if (locked.has(occ.id)) { hl.textContent = '이 칸은 이미 맞혔어요.'; return; } delete place[occ.id]; } }
      place[selected] = b.id; selected = null; draw();
    });
    mf.querySelector('#ck').onclick = check;
  };
  const check = () => {
    const wrong = st.cards.filter(c => place[c.id] && place[c.id] !== c.ans);
    if (!wrong.length) { st.cards.forEach(c => { if (place[c.id]) locked.add(c.id); }); draw(); return api.pass(); }
    st.cards.forEach(c => { if (place[c.id] && place[c.id] === c.ans) locked.add(c.id); });
    wrong.forEach(c => delete place[c.id]);
    draw();
    wrong.forEach(c => { const el = mb.querySelector(`[data-c="${c.id}"]`); if (el) el.classList.add('shake'); });
    const lines = wrong.slice(0, 2).map(c => [api.who, 'normal', `"${c.text.replace(/^봉투 [①②③] |^오실장 메모: /, '').slice(0, 24)}${c.text.length > 24 ? '…' : ''}" 카드는 다시 생각해 봐요. ${c.hint}`]);
    if (wrong.length > 2) lines.push([api.who, 'normal', `틀린 카드가 ${wrong.length - 2}장 더 있어요. 맞힌 카드는 초록색으로 남겨 둘게요.`]);
    api.wrong(lines);
  };
  draw();
};

/* --- 선택 기준표 (하늘이 쇼핑) --- */
KIND.shop = (st, mb, mf, hl, api) => {
  const crit = new Set(), items = new Set(); let reason = -1;
  const draw = () => {
    const total = [...items].reduce((a, id) => a + st.items.find(x => x.id === id).price, 0);
    const over = total > st.budget;
    mb.innerHTML = `<div class="shop-sec"><h4>① 나에게 중요한 기준 2개</h4><div class="crit">${st.criteria.map(c => `<button class="${crit.has(c.id) ? 'sel' : ''}" data-cr="${c.id}">${esc(c.text)}</button>`).join('')}</div></div>
      <div class="shop-sec"><h4>② 3만 원 안에서 살 것 고르기</h4><div class="items">${st.items.map(it => `<button class="item ${items.has(it.id) ? 'sel' : ''}" data-it="${it.id}"><div class="ic">${it.icon}</div><b>${esc(it.text)}</b><div class="pr">${won(it.price)}</div><small>"${esc(it.note)}"</small></button>`).join('')}</div>
        <div class="wallet">👛 <span>${won(total)} / 3만 원</span><div class="tbar"><i class="${over ? 'over' : ''}" style="width:${Math.min(100, total / st.budget * 100)}%"></i></div></div></div>
      <div class="shop-sec"><h4>③ 이렇게 고른 까닭</h4><div class="opts">${st.reasons.map((r, i) => `<button class="opt ${reason === i ? 'sel' : ''}" data-r="${i}"><span class="mark"></span><span>${esc(r.text)}</span></button>`).join('')}</div></div>`;
    const ready = crit.size === 2 && items.size > 0 && reason >= 0;
    mf.innerHTML = `<button class="btn primary" id="ck" ${ready ? '' : 'disabled'}>이렇게 살래요</button>`;
    hl.textContent = crit.size !== 2 ? '기준을 꼭 2개 골라 주세요.' : items.size === 0 ? '살 것을 하나 이상 골라 주세요.' : reason < 0 ? '고른 까닭을 골라 주세요.' : '';
    mb.querySelectorAll('[data-cr]').forEach(b => b.onclick = () => {
      const id = b.dataset.cr;
      if (crit.has(id)) crit.delete(id); else { if (crit.size >= 2) { toast('기준은 2개까지 고를 수 있어요.'); return; } crit.add(id); }
      draw();
    });
    mb.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { const id = b.dataset.it; items.has(id) ? items.delete(id) : items.add(id); draw(); });
    mb.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { reason = +b.dataset.r; draw(); });
    mf.querySelector('#ck').onclick = () => {
      if (over) return api.wrong([[api.who, 'worried', `지금 고른 것을 다 더하면 ${won(total)}이야. 3만 원을 넘어서 지갑이 닫히지 않아!`]]);
      const r = st.reasons[reason];
      if (!r.crit) return api.wrong(r.why);
      if (!crit.has(r.crit)) {
        const names = [...crit].map(id => `"${st.criteria.find(c => c.id === id).text}"`).join(', ');
        return api.wrong([[api.who, 'serious', `네가 고른 기준은 ${names}였잖아. 그 기준에 맞는 까닭을 골라 볼까?`]]);
      }
      const left = st.budget - total;
      if (left > 0) toast(`남은 ${won(left)}은 저금통에 저축!`);
      api.pass();
    };
  };
  draw();
};

/* --- 근로계약서 --- */
KIND.contract = (st, mb, mf, hl, api) => {
  const marked = new Set(); let filled = false;
  const draw = () => {
    mb.innerHTML = `<div class="contract"><h3>근 로 계 약 서</h3>${st.fields.map(f => {
      const blank = !f.value;
      const v = blank ? (filled && f.need ? `<span class="filled">${esc(f.fill)}</span>` : '<span class="blank"></span>') : `<span class="cv">${esc(f.value)}</span>`;
      return `<button class="crow ${marked.has(f.id) && !filled ? 'mark' : ''}" data-f="${f.id}" ${blank ? '' : 'tabindex="-1"'}><span class="cl">${esc(f.label)}</span>${v}</button>`;
    }).join('')}</div>`;
    mf.innerHTML = filled ? '' : `<button class="btn primary" id="ck" ${marked.size ? '' : 'disabled'}>빠진 칸을 다 찾았어요</button>`;
    hl.textContent = filled ? '' : '비어 있는 칸을 누르면 "빠졌어요!" 도장이 찍혀요. 다시 누르면 지워져요.';
    mb.querySelectorAll('.crow').forEach(b => b.onclick = () => {
      if (filled) return; const f = st.fields.find(x => x.id === b.dataset.f); if (f.value) return;

    });
    const ck = mf.querySelector('#ck'); if (ck) ck.onclick = () => {
      const extra = st.fields.find(f => marked.has(f.id) && !f.need);

      const miss = st.fields.some(f => f.need && !marked.has(f.id));
      if (miss) return api.wrong(st.missing || api.node.missing);
      filled = true; draw(); setTimeout(() => api.pass(), 900);
    };
  };
  draw();
};

KIND.order = (st, mb, mf, hl, api) => {

    const left = shuffled.filter(i => !seq.includes(i));

    mb.querySelectorAll('.chip').forEach(b => b.onclick = () => { seq.push(+b.dataset.i); draw(); });

    };
  };
  draw();
};

/* ===================== 장 끝 ===================== */
const STORY_RULES = {

  iyoung: () => S.res['5-2'] && S.res['5-2'].wrongs === 0,

};

    <div class="m-foot">${nextCh ? `<button class="btn" id="rest">저장하고 쉬기</button><button class="btn primary" id="nx">${nextCh.no}장으로 가기</button>` : ''}</div>

/* ===================== 엔딩 ===================== */
function endingKey() {
  const g = gaugeVals(); const vals = Object.values(g); const avg = vals.reduce((a, b) => a + b, 0) / 4;
  const clean = !S.flags.nightShift && !S.flags.collusion && S.res['5-2'] && S.res['5-2'].wrongs === 0 && S.res['6-1'] && S.res['6-1'].wrongs === 0 && S.res['6-2'] && S.res['6-2'].wrongs === 0;
  if (clean && vals.every(v => v >= 80)) return 'hidden';
  if (avg >= 85) return 'big';
  if (avg >= 58) return 'ok';
  return 'low';
}
function renderEnding() {
  const key = endingKey(); const e = ENDINGS[key];
  S.ending = { key, date: new Date().toISOString() };
  if (!S.done.includes(7)) S.done.push(7);
  if (!S.stories.includes('oh')) S.stories.push('oh');
  S.cur = null; saveState();
  const ch = CHAPTERS[6];
  renderScene(ch, { type: 'scene', bg: e.bg, label: e.title, lines: e.lines }, () => renderResult(true));
}
function renderResult(fresh) {
  closeModal();
  if (!S.ending) return renderTitle();
  const e = ENDINGS[S.ending.key]; const g = gaugeVals();
  const d = new Date(S.ending.date); const ds = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
  $app.innerHTML = `<div class="page"><div class="page-head"><h2>데뷔 기록 카드</h2><button class="btn small" data-back>처음 화면</button></div>
    <div class="result">
      <div class="top"><small>엔딩</small><h2>${esc(e.title)}</h2><div class="grp">그룹 「${esc(S.group)}」 · ${esc(S.ceo)} 대표</div><img class="lineup" src="${IMG.lineup}" alt=""></div>
      <dl><dt>모은 개념 포카</dt><dd>${ownedPocas().size} / ${POCA_IDS.length}장</dd>
        <dt>한 번에 맞힌 미션</dt><dd>${firstTryCount()} / ${TOTAL_MISSIONS}개</dd>
        <dt>열린 숨은 이야기</dt><dd>${S.stories.length} / ${Object.keys(STORIES).length}편</dd>
        <dt>날짜</dt><dd>${ds}</dd></dl>
      <div class="gsum">${GAUGES.map(x => `<div><span>${x.icon} ${x.name}</span><b>${g[x.key]}</b></div>`).join('')}</div>
    </div>
    <p style="text-align:center;color:var(--ink2)">이 화면을 선생님께 보여 주세요.</p>
    <div class="m-foot"><button class="btn" data-dex>포카 도감 보기</button><button class="btn primary" data-back2>처음 화면으로</button></div></div>`;
  $app.querySelector('[data-back]').onclick = renderTitle;
  $app.querySelector('[data-back2]').onclick = renderTitle;
  $app.querySelector('[data-dex]').onclick = () => renderDex('poca');
  if (fresh) setTimeout(() => toast('🔓 숨은 이야기 「오실장과 삼촌의 첫 사무실」이 열렸어요!', 3000), 400);
}

/* ===================== 도감 ===================== */
function dexBody(tab) {
  const owned = ownedPocas();
  if (tab === 'poca') return `<div class="dex">${POCA_IDS.map(id => owned.has(id) ? pocaHTML(id) : `<div class="locked"><div><big>?</big>${POCAS[id].ch}장에서 얻어요</div></div>`).join('')}</div>`;
  return `<div class="stories">${Object.entries(STORIES).map(([id, st]) => S.stories.includes(id)
    ? `<button class="story" data-st="${id}">${avatarHTML(id, 'smile', 'sm')}<span><b>${esc(st.title)}</b><small>${st.ch}장 · 눌러서 읽기</small></span></button>`
    : `<div class="story off"><span style="font-size:2rem">🔒</span><span><b>${esc(st.title)}</b><small>${esc(st.cond)}</small></span></div>`).join('')}</div>`;
}
function renderDex(tab) {
  closeModal();
  const owned = ownedPocas();
  $app.innerHTML = `<div class="page"><div class="page-head"><h2>포카 도감 ${owned.size}/${POCA_IDS.length}</h2>
    <div class="tabs"><button class="${tab === 'poca' ? 'sel' : ''}" data-t="poca">개념 포카</button><button class="${tab === 'story' ? 'sel' : ''}" data-t="story">숨은 이야기 ${S.stories.length}/${Object.keys(STORIES).length}</button></div>
    <button class="btn small" data-back>처음 화면</button></div>${dexBody(tab)}</div>`;
  $app.querySelector('[data-back]').onclick = renderTitle;
  $app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => renderDex(b.dataset.t));
  bindFlip($app);
  $app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => playStory(b.dataset.st));
}
function openDexModal() {
  const owned = ownedPocas();
  const m = modal(`<h2>포카 도감 ${owned.size}/${POCA_IDS.length}</h2><div class="dex" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${POCA_IDS.filter(id => owned.has(id)).map(id => pocaHTML(id)).join('') || '<p style="text-align:center;grid-column:1/-1">아직 모은 포카가 없어요. 미션을 풀면 생겨요!</p>'}</div>
    <div class="modal-btns"><button class="btn primary" data-a="c">닫기</button></div>`);
  bindFlip(m); m.querySelector('[data-a=c]').onclick = closeModal;
}
function openMenu() {
  const m = modal(`<h2>메뉴</h2><div class="menu-list">
    <button class="btn" data-m="resume">계속하기</button>
    <button class="btn" data-m="select">장 고르기</button>
    <button class="btn" data-m="dex">포카 도감 · 숨은 이야기</button>
    <button class="btn" data-m="title">처음 화면 (저장돼요)</button></div>`);
  m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const a = b.dataset.m; closeModal();
    if (a === 'select') renderSelect(); if (a === 'dex') renderDex('poca'); if (a === 'title') renderTitle();
  });
}

/* ---------- 시작 ---------- */
renderTitle();

</script>
</body>
</html>
